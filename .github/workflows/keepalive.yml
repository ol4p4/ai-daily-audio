name: Keepalive

# GitHub 会在仓库连续 60 天没有任何 commit 后自动禁用定时工作流。
# 本工作流每月写入一次 .keepalive，用一次 commit 重置这个计时器。
on:
  schedule:
    - cron: "0 1 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  touch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh heartbeat file
        run: date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          git commit -m "chore: keepalive $(date -u +%Y-%m-%d)"
          git push
