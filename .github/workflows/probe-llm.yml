name: probe-llm

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe candidate models
        env:
          KEY: ${{ secrets.OPENAI_API_KEY }}
          BASE: ${{ secrets.LLM_API_BASE }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request, urllib.error

          base = (os.environ.get("BASE") or "https://integrate.api.nvidia.com/v1").rstrip("/")
          key = os.environ.get("KEY") or ""

          models = [
              "z-ai/glm-5.3-flash",
              "minimaxai/minimax-m3.1-flash",
              "stepfun-ai/step-5-preview",
              "nvidia/nemotron-3.5-lightning-30b-a3b",
              "openai/gpt-oss-20b",
          ]

          prompt = "把这句话翻译成中文，只输出译文：The Federal Reserve held interest rates steady on Wednesday, citing persistent inflation."

          for m in models:
              payload = json.dumps({
                  "model": m,
                  "messages": [{"role": "user", "content": prompt}],
                  "temperature": 0.2,
                  "max_tokens": 3000,
              }).encode()
              req = urllib.request.Request(
                  f"{base}/chat/completions", data=payload,
                  headers={"Content-Type": "application/json", "Authorization": f"Bearer {key}"},
                  method="POST",
              )
              t0 = time.time()
              try:
                  with urllib.request.urlopen(req, timeout=180) as r:
                      body = json.loads(r.read().decode())
                      ch = body["choices"][0]
                      msg = ch.get("message") or {}
                      content = (msg.get("content") or "").strip()
                      reasoning = (msg.get("reasoning_content") or msg.get("reasoning") or "")
                      text = content or reasoning
                      cjk = sum(1 for c in text if "\u4e00" <= c <= "\u9fff")
                      print(f"[OK] {m}")
                      print(f"     dt={time.time()-t0:.1f}s finish={ch.get('finish_reason')} "
                            f"content_len={len(content)} reasoning_len={len(reasoning)} cjk={cjk}")
                      print(f"     sample={content[:80]!r}")
              except urllib.error.HTTPError as e:
                  print(f"[{e.code}] {m} {e.read().decode('utf-8','replace')[:140]}")
              except Exception as e:
                  print(f"[ERR] {m} {type(e).__name__}: {e}")
          PY
